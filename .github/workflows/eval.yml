name: eval-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python + deps
        run: uv sync --frozen

      # Cache the HuggingFace models (~1.4GB) so reruns don't re-download.
      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('uv.lock') }}

      # Rebuild the vector store from the shipped chunks.jsonl.
      - name: Build index
        run: uv run askmydocs embed

      - name: Run eval quality gate
        run: uv run pytest tests/test_eval_gate.py -v -s